<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <action="proses.php" method="post">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda" name="nama" required><br><br>

            <label for="date" >Tanggal Lahir:</label>
            <input type="date" id="date" name="date" required><br><br>

            <label for="gender" >Jenis Kelamin:</label>
            <input type="radio" id="male" name="gender" value="1" required>
            <label for="male">Laki-laki</label>
            <input type="radio" id="female" name="gender" value="2" required>
            <label for="female">Perempuan</label><br><br>

            <label for="kelas" >Kelas:</label><br>
            <select id="pilih kelas" name="kelas" required>
                <option value="">Pilih Kelas</option>
                <option value="XI RPL">XI RPL</option>
                <option value="XI TKJ">XI TKJ</option>
                <option value="XI ULW">XI ULW</option>
                <option value="XI PSPT">XI PSPT</option>
            </select><br><br>

            <label for="alamat" >Alamat:</label><br>
            <textarea id="alamat" name="alamat" rows="4" cols="50" placeholder="Masukkan alamat Anda" required></textarea><br><br>

            <label for="Telepon" >Nomor Telepon:</label><br>
            <input type="tel" id="Telepon" name="Telepon" placeholder="Masukkan nomor " required><br><br>


    </form>
</body>
</html>
